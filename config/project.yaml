# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"
  # scope: personal | work — the project's nature, read by the storage
  # routing rule in .claude/skills/lake-conventions/. Absent means work
  # (lake-only; home storage stays closed). The hub is a template and
  # declares neither.

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Machine roster — keyed by hostname, read by src/myproject/utils/machine.py
#
# Discovery is per-machine and always has been; this block is the fleet's only
# written record of its own members. An unlisted hostname resolves to `unknown`
# and still works, it just knows less. Add a box on first visit.
#
# No usernames here. Per-user namespaces are derived from $USER at runtime.
machines:
  titanx:
    role: workstation
    scope: [work, personal]
    references:
      lakehouse: ~/projects/gitlab/dis-data/dis-lakehouse
  Nidhogg:
    role: workstation
    scope: [personal]
    references:
      home_storage: ~/projects/github/tacsop/docs/design/hold/STORAGE.md
  unknown:
    role: unspecified
    scope: [personal]
    references: {}

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "uv"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
state:
  last_session:
    date: "2026-10-02"
    file: "docs/sessions/20261002_backlog_cycle_private_terms_and_release_drafts.md"
    summary: "Three asks landed on Nidhogg: the OVERWATCH release entries are drafted in docs/plans/ (A1, A2, B to G; outside the file the script reads; the hold on propagating them stands); the doctrine backlog (08-21 to 09-18) reached 16 repos in one cycle, 70 deliveries, five marks seeded first; and the agent-output-destination rule shipped as prose on six surfaces plus /pcc check 7, a Private-Term Check whose term list lives outside every repo, after three code-reviewer rounds (GO-WITH-FIXES, GO-WITH-FIXES, GO). The session also found that the 2026-10-01 record of keeping five private terms out of this public repo had pasted the five terms into its own Evidence line, pushed; the line was redacted, the unpushed history rebuilt so no pushed tree carries it, and the user accepted that seven public commits keep it in history. The adoption helper now copies all 12 Level 0 skills (it copied 6). Tests 432 to 462. Found at close: a GitHub mirror of a GitLab work repo sits under ~/projects with .claude/commands/, so discovery would notify it; a P1 keeps propagation out of it."
  active_work: "Before any propagation run from any box: keep ~/projects/github/assay (a mirror this hub never writes to) out of discovery, hub-side, test-first (P1). Then the work terminal: OVERWATCH Wave 0 falsifiers (0b to 0d), task 1e, task 2d; 2d decides Wave 2 and lifts the release hold. Then the release in one cycle from docs/plans/20261002_overwatch_release_entries_draft.md: fill dates and the 2d paragraph, settle the three open items (the A1/A2 split, the KB-graph capture point's own entry, entry F's final verdict is recorded), copy to docs/doctrine-updates.md, pre-flight, dry run, propagate. After 2d: the three held traps for the verifying-claims skill. Still open from before: the WHETSTONE Wave 1 count, launch-control and veil-engine harvests, the audit-hook pin, the dev/prod config-profile ADR, the configuration-management reconciliation, the fleet ledger, the 0.2.0 cut, the propter check 6 and D4 reconciliation (P3)."
  # Known unknowns live in docs/gaps.md, the gap register; defects are tasks.

# Slash commands reference
commands:
  session_start: "Load context, check health, review tasks"
  session_end: "Commit, update tasks, write session doc"
  pcc: "Pre-Code Check — fast pass/fail before push"
  pci: "Pre-Code Inspection — context-aware review"
  task: "Manage task list, escalate work items"
