# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"
  # scope: personal | work — the project's nature, read by the storage
  # routing rule in .claude/skills/lake-conventions/. Absent means work
  # (lake-only; home storage stays closed). The hub is a template and
  # declares neither.

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Machine roster — keyed by hostname, read by src/myproject/utils/machine.py
#
# Discovery is per-machine and always has been; this block is the fleet's only
# written record of its own members. An unlisted hostname resolves to `unknown`
# and still works, it just knows less. Add a box on first visit.
#
# No usernames here. Per-user namespaces are derived from $USER at runtime.
machines:
  titanx:
    role: workstation
    scope: [work, personal]
    references:
      lakehouse: ~/projects/gitlab/dis-data/dis-lakehouse
  Nidhogg:
    role: workstation
    scope: [personal]
    references:
      home_storage: ~/projects/github/tacsop/docs/design/hold/STORAGE.md
  unknown:
    role: unspecified
    scope: [personal]
    references: {}

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "uv"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
state:
  last_session:
    date: "2026-10-01"
    file: "docs/sessions/20260930_overwatch_claim_checks_and_data_loss_guards.md"
    summary: "CONOP OVERWATCH, from a work-terminal Insights report (overclaims in at least 6 of 22 sessions; a 138 GB deletion by a test fixture). Approved after a blind proposer and code-reviewer debate that refuted 5 of the draft's claims. Wave 1 tasks 1a to 1d merged: an audit-hook test tripwire (43 tests, three gate rounds), install commands pinned to --python .venv, /session-start tool checks (9 tests), and a Purpose column on task specs. Releasing them exposed the newest-entry-only transport; its fix, a heading-set delivery mark, merged after three gate rounds. Nothing propagated. 308 to 403 tests. Reviewers refuted 19 of the lead's claims across the session; the lead's own re-runs caught 9 more."
  active_work: "OVERWATCH: hand-seed delivery marks for five repos and draft four OVERWATCH entries (1c alone as breaking), then propagate the backlog in one cycle on the lead's go (P1). On the work terminal: Wave 0 falsifiers (ask rules in that mode with its glab version; claim-detector spike; command replay), then task 1e ask rules. Then Wave 2, the verifying-claims kernel. Still open from before: launch-control upstream-lesson harvest, the audit-hook pin (port propter's tests; widen to scripts/), the WHETSTONE Wave 1 count, the dev/prod config-profile ADR, the configuration-management reconciliation, the fleet ledger, the veil-engine harvest, the five March docs, the 0.2.0 cut."
  known_issues:
    - "Audit hook is soft-deterministic (logs, never blocks); cannot enforce temporal vertical-slicing (all tests then all impl)"
    - "Audit hook watches src/myproject/ only: this session's code (scripts/, tests/isolation.py) never reached it (P1 hook task; propter widened to scripts/). The May 2026 one-level glob defect does not affect the current hook (bash case '*' crosses slashes; verified 2026-08-30)"
    - "exponential() raises ZeroDivisionError for nonzero |rate| < ~2.2e-16 (Active task; repro in docs/tasks.md)"
    - "No participant can observe the whole fleet: discovery is per-machine and the two boxes' scans disagree 9 against 16; Nidhogg's discovery now finds 19 (P1)"
    - "Isolation tripwire limits are listed in shift-left-testing/ISOLATION.md; no test pins that it disarms between tests (gate mutant M7)"

# Slash commands reference
commands:
  session_start: "Load context, check health, review tasks"
  session_end: "Commit, update tasks, write session doc"
  pcc: "Pre-Code Check — fast pass/fail before push"
  pci: "Pre-Code Inspection — context-aware review"
  task: "Manage task list, escalate work items"
