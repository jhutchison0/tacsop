# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"
  # scope: personal | work — the project's nature, read by the storage
  # routing rule in .claude/skills/lake-conventions/. Absent means work
  # (lake-only; home storage stays closed). The hub is a template and
  # declares neither.

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Machine roster — keyed by hostname, read by src/myproject/utils/machine.py
#
# Discovery is per-machine and always has been; this block is the fleet's only
# written record of its own members. An unlisted hostname resolves to `unknown`
# and still works, it just knows less. Add a box on first visit.
#
# No usernames here. Per-user namespaces are derived from $USER at runtime.
machines:
  titanx:
    role: workstation
    scope: [work, personal]
    references:
      lakehouse: ~/projects/gitlab/dis-data/dis-lakehouse
  Nidhogg:
    role: workstation
    scope: [personal]
    references:
      home_storage: ~/projects/github/tacsop/docs/design/hold/STORAGE.md
  unknown:
    role: unspecified
    scope: [personal]
    references: {}

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "uv"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
state:
  last_session:
    date: "2026-10-01"
    file: "docs/sessions/20261001_assay_bootstrap_and_agent_output_destination.md"
    summary: "The hub cloned itself into a new project, `assay`, and found a defect in how it deploys agents. Three agents reviewed that project's plan before any code and found ten defects, two expensive: an object-path grammar that would have silently destroyed 49 of 79 archive files, and a least-squares rate fit with rank 10 against 22 columns that returns negative prices while reproducing every billed day within 1.14%. Every load-bearing agent claim was re-derived before being acted on. The hub-side lesson: an agent's output destination belongs to the repository that owns the sensitivity, not the working directory it runs in. Three agents wrote reports carrying internal names into this public repo; nothing was committed, containment was `code-reviewer` sanitizing its own draft and saying so. Merged 29 commits from the other box; 403 to 432 tests. Two sessions closed on 2026-10-01 on two boxes and last_session holds one slot; the other is docs/sessions/20261001_overwatch_wave2_verifying_claims.md, which merged OVERWATCH Wave 2 tasks 2a to 2c and the verifying-claims skill. The collision is the WHETSTONE session-count problem recurring, now on the same calendar day."
  active_work: "Decide where the agent-output-destination rule lives: the scope matrix, the agent definitions, or a /pcc check that refuses to stage a file carrying strings absent from HEAD, which is the only deterministic option (P2, doctrine candidate, not staged because of the release hold). Then oVERWATCH, on the work terminal: Wave 0 falsifiers (0b ask rules in that terminal's mode, with its glab version; 0c claim-detector spike; 0d command replay), then task 1e ask rules, then task 2d, the controlled replay that decides Wave 2. Then the release in one cycle: seed marks for five repos, draft the OVERWATCH entries (1c alone as breaking; the Wave 2 entry lists the six surfaces its tests read), pre-flight, dry run, propagate on the lead's go. Still open from before: the WHETSTONE Wave 1 count (now reported for two capture regimes), launch-control upstream-lesson harvest, the audit-hook pin (port propter's tests; widen to scripts/), the dev/prod config-profile ADR, the configuration-management reconciliation, the fleet ledger, the veil-engine harvest, the 0.2.0 cut."
  known_issues:
    - "Audit hook is soft-deterministic (logs, never blocks); cannot enforce temporal vertical-slicing (all tests then all impl)"
    - "Audit hook watches src/myproject/ only: this session's code (scripts/, tests/isolation.py) never reached it (P1 hook task; propter widened to scripts/). The May 2026 one-level glob defect does not affect the current hook (bash case '*' crosses slashes; verified 2026-08-30)"
    - "exponential() raises ZeroDivisionError for nonzero |rate| < ~2.2e-16 (Active task; repro in docs/tasks.md)"
    - "No participant can observe the whole fleet: discovery is per-machine and the two boxes' scans disagree 9 against 16; Nidhogg's discovery now finds 19 (P1)"
    - "Isolation tripwire limits are listed in shift-left-testing/ISOLATION.md; no test pins that it disarms between tests (gate mutant M7)"
    - "The verifying-claims kernel is live in this repo's CLAUDE.md and untested: task 2d, the controlled replay, has not run (work terminal). In the session that wrote it, reviewers still refuted 5 of the lead's claims after the kernel was ambient"

# Slash commands reference
commands:
  session_start: "Load context, check health, review tasks"
  session_end: "Commit, update tasks, write session doc"
  pcc: "Pre-Code Check — fast pass/fail before push"
  pci: "Pre-Code Inspection — context-aware review"
  task: "Manage task list, escalate work items"
