# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "uv"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
state:
  last_session:
    date: "2026-08-27"
    file: "docs/sessions/20260827_figure_style_doctrine_from_stx_server.md"
    summary: "Figure Style doctrine: designing-clear-data-displays (Tufte, 1.1.0) copied whole from stx-server and wired; stx-server's three hub-upward items applied (research tools on two agents, audit-hook import-grep fallback test-first, writing-skill hand-off); 33-lesson harvest (first D10 intake from a non-canary repo); 2026-08-27 doctrine entry authored and pre-flighted, dry run 16 repos, live propagation pending the user's go; 27 em dashes swept from four template docs; skills inventories completed."
  active_work: "Propagate the 2026-08-27 entry (dry run 16 repos; user's go pending); harvest veil-engine's six pending upward lessons; WHETSTONE Wave 1 window (session 1 of 5 logged 2026-08-27); uv migration and P1 rename on work/home/laptop; Day-1 playbook rewrite (P2, now carries stx-server's bootstrap-audit findings); decide the five March docs (present on this box); 0.2.0 cut."
  known_issues:
    - "Audit hook is soft-deterministic (logs, never blocks); cannot enforce temporal vertical-slicing (all tests then all impl)"
    - "exponential() raises ZeroDivisionError for nonzero |rate| < ~2.2e-16 (Active task; repro in docs/tasks.md)"

# Slash commands reference
commands:
  session_start: "Load context, check health, review tasks"
  session_end: "Commit, update tasks, write session doc"
  pcc: "Pre-Code Check — fast pass/fail before push"
  pci: "Pre-Code Inspection — context-aware review"
  task: "Manage task list, escalate work items"
