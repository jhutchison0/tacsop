[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myproject"
version = "0.1.0"
description = "A Python project template with reusable utilities"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    # zoneinfo backing data is missing from CPython on Windows; the logger
    # falls back gracefully without it (see src/myproject/utils/logger.py),
    # but installing tzdata makes named timezones work as expected.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
excel = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
]
slack = [
    "slack-sdk>=3.20",
]
database = [
    "psycopg[binary]>=3.1",
]
weights = [
    "pandas>=2.0",
]
decision-science = [
    "matplotlib>=3.5",
]
all = [
    "myproject[dev,excel,slack,database,weights,decision-science]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/myproject"]

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
