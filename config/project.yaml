# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "pip"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
state:
  last_session:
    date: "2026-05-23"
    file: "docs/sessions/20260523_proword_convention_for_plans.md"
    summary: "Added proword convention for CONOPs and OPORDs to /task: 2–3 syllable concrete noun, NATO-phonetic-adjacent, roll-your-own picking; scaling doctrine preserved for above-OPORD use. Cleared stale P1 propagation task (shipped last session) and replaced with P3 entry tracking two small refinements (deep-modules discipline + prowords) accumulating for the next propagation cycle. No production code changed; 259 passing."
  active_work: "Two small refinements accumulating for the next doctrine propagation cycle — deep-modules (8ad387e, 2026-05-20) + proword convention (2026-05-23). No urgency: 23-artifact bundle just shipped; downstream repos still have unread cycles."
  known_issues:
    - "numpy must be installed manually if venv predates decision_science addition"
    - "Audit hook is soft-deterministic (logs, never blocks); cannot enforce temporal vertical-slicing (all tests then all impl)"

# Slash commands reference
commands:
  session_start: "Load context, check health, review tasks"
  session_end: "Commit, update tasks, write session doc"
  pcc: "Pre-Code Check — fast pass/fail before push"
  pci: "Pre-Code Inspection — context-aware review"
  task: "Manage task list, escalate work items"
