# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"
  # scope: personal | work — the project's nature, read by the storage
  # routing rule in .claude/skills/lake-conventions/. Absent means work
  # (lake-only; home storage stays closed). The hub is a template and
  # declares neither.

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Machine roster — keyed by hostname, read by src/myproject/utils/machine.py
#
# Discovery is per-machine and always has been; this block is the fleet's only
# written record of its own members. An unlisted hostname resolves to `unknown`
# and still works, it just knows less. Add a box on first visit.
#
# No usernames here. Per-user namespaces are derived from $USER at runtime.
machines:
  titanx:
    role: workstation
    scope: [work, personal]
    references:
      lakehouse: ~/projects/gitlab/dis-data/dis-lakehouse
  Nidhogg:
    role: workstation
    scope: [personal]
    references:
      home_storage: ~/projects/github/tacsop/docs/design/hold/STORAGE.md
  unknown:
    role: unspecified
    scope: [personal]
    references: {}

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "uv"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
