# Project Configuration — Single Source of Truth
# Rename 'myproject' when starting a new project

project:
  name: "myproject"
  version: "0.1.0"
  description: "A Python project template with reusable utilities"
  python_requires: ">=3.11"

# Design pillars — define in docs/design/pillars.md
# Reference them here by name for quick lookup
design_pillars:
  - "Simplicity First"
  - "Shift-Left Testing"
  - "Config-Driven"
  # TODO: Add your project-specific pillars

# Machine roster — keyed by hostname, read by src/myproject/utils/machine.py
#
# Discovery is per-machine and always has been; this block is the fleet's only
# written record of its own members. An unlisted hostname resolves to `unknown`
# and still works, it just knows less. Add a box on first visit.
#
# No usernames here. Per-user namespaces are derived from $USER at runtime.
machines:
  titanx:
    role: workstation
    scope: [work, personal]
    references:
      lakehouse: ~/projects/gitlab/dis-data/dis-lakehouse
  unknown:
    role: unspecified
    scope: [personal]
    references: {}

# Directory structure
paths:
  source: "src/myproject"
  tests: "tests"
  config: "config"
  docs: "docs"
  sessions: "docs/sessions"
  plans: "docs/plans"
  reviews: "docs/reviews"

# Build phases — update status as work progresses
# Statuses: not_started, in_progress, complete
build_phases:
  phase_1:
    name: "Foundation"
    status: "complete"
    deliverable: "Project template with utility modules and dev workflow"
  phase_2:
    name: "TODO"
    status: "not_started"
    deliverable: "TODO: define your next phase"

# Python settings
python:
  min_version: "3.11"
  test_framework: "pytest"
  package_manager: "uv"

# Testing configuration
testing:
  command: "pytest"
  coverage_threshold: 80
  test_patterns:
    - "tests/unit/test_*.py"
    - "tests/integration/test_*.py"

# Session state
state:
  last_session:
    date: "2026-08-28"
    file: "docs/sessions/20260828_fleet_poll_and_loop_closure_audit.md"
    summary: "Second 2026-08-28 session, on the other machine. Merged the two boxes' Wave 1 work (three conflicts, disjoint not duplicated) and found both had numbered the same five-session window 1 and 2. Polled all 13 repos here: 9 discoverable, 4 carry the traversal skill, 3 distinct copies of it already, adoption to first organic use is 1 day where it happens. The recursion loop has closed twice for real and has three mechanical breaks: the observer is per-machine, the notification ships 1 of 12 entries, and the capture point was never shipped. Prior session that day: docs/sessions/20260828_cross_repo_feedback_loop_check.md."
  active_work: "Push three unpushed commits. Settle the contested WHETSTONE Wave 1 session count (P1) before the exit criterion can be evaluated. Three P1 loop fixes from the 2026-08-28 poll: ship the capture point, make the notification carry the unacknowledged set, decide what the fleet ledger is. Carried from the earlier 2026-08-28 session: propagate the 2026-08-27 entry (its dry run reached 16 repos; this box's reaches 9, which is the fleet-partition finding in one number), harvest veil-engine's six captured lessons (13 days), route delta lessons 34 to 41 at their cycles. Also open: uv migration and P1 rename on work/home/laptop; Day-1 playbook rewrite (P2); decide the five March docs; 0.2.0 cut."
  known_issues:
    - "Audit hook is soft-deterministic (logs, never blocks); cannot enforce temporal vertical-slicing (all tests then all impl)"
    - "exponential() raises ZeroDivisionError for nonzero |rate| < ~2.2e-16 (Active task; repro in docs/tasks.md)"
    - "propagate_doctrine.py emits only the most recent doctrine entry; a consumer that misses a cycle stays missed and the hub reads the same either way (P1; found downstream in ffskg 2026-08-13, reached the hub 2026-08-28)"
    - "No participant can observe the whole fleet: discovery is per-machine and the two boxes' scans disagree 9 against 16 (P1)"
    - "No git identity configured on this box; commits require GIT_AUTHOR_* passed explicitly"

# Slash commands reference
commands:
  session_start: "Load context, check health, review tasks"
  session_end: "Commit, update tasks, write session doc"
  pcc: "Pre-Code Check — fast pass/fail before push"
  pci: "Pre-Code Inspection — context-aware review"
  task: "Manage task list, escalate work items"
